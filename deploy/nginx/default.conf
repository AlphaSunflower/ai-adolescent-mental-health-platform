# 边缘代理(compose 内 nginx)
# 职责:收口缓存策略,杜绝旧版 HTML 被共享缓存(宝塔 nginx / 运营商 / 代理)留存。
#   - HTML 一律 no-store(Next 静态页默认发 s-maxage=31536000,会被缓存一年)
#   - /_next/static 文件名带内容 hash,一年 immutable 强缓存
# 拓扑:宝塔 nginx(443/TLS)→ 本容器 3200(web-client)/3201(admin-portal)
#   宝塔站点反代目标:web-client 3100 → 3200;admin-portal 3101 → 3201;并清空宝塔侧缓存

# web-client
server {
    listen 80;
    server_name _;

    location /_next/static/ {
        proxy_pass http://web-client:3100;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://web-client:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}

# admin-portal
server {
    listen 81;
    server_name _;

    location /_next/static/ {
        proxy_pass http://admin-portal:3101;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://admin-portal:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
